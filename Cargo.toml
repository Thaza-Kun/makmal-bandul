[package]
name = "makmal-bandul"
version = "0.1.0"
edition = "2021"
description = "Offline-first pendulum experiment lab for physics students"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "HtmlSelectElement",
    "DomRect",
    "Performance",
    "Navigator",
    "Clipboard",
    "Blob",
    "Url",
    "Storage",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "PointerEvent",
    "EventTarget",
    "Request",
    "RequestInit",
    "Response",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
rapier2d = { version = "0.22", default-features = false, features = [
    "dim2",
    "f32",
    "enhanced-determinism",
    "wasm-bindgen",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
