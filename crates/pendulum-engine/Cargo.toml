[package]
name = "pendulum-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic pendulum domain, physics and calculations"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapier2d = { version = "0.22", default-features = false, features = [
    "dim2",
    "f32",
    "enhanced-determinism",
    "wasm-bindgen",
] }
